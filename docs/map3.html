<!DOCTYPE html>
<html>
<head>
    <title>Cities and Things</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.10.0/dist/maplibre-gl.css" />
    <style>
        body { margin: 0; }
        #map { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script type="module">
        import * as maplibregl from 'https://unpkg.com/maplibre-gl@^6.10.0/dist/maplibre-gl.mjs';

        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/positron',
            center: [-108.2833, 32.7764],   // [lng, lat] -- note the order, opposite of Leaflet's [lat, lng]!
            zoom: 10,
            pitch: 0,
            bearing: 0
        });
        window.map = map;   // exposes map to the browser console for debugging

map.on('load', () => {
    map.addSource('usgs-topo', {
        type: 'raster',
        tiles: ['https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}'],
        tileSize: 256,
        attribution: 'USGS'
    });
    map.addLayer({ id: 'usgs-topo-layer', type: 'raster', source: 'usgs-topo' });
});


// A file sitting in a data/ folder next to this HTML file
map.on('load', () => {
        map.addSource('cities', {
            type: 'geojson',
            data: 'data/nm_populated_places.geojson'
        });

        map.addLayer({
            id: 'cities-points',
            type: 'circle',
            source: 'cities',
            paint: {
                'circle-radius': 4,
                'circle-color': '#C54AFF'
            }
        });
});

map.on('load', () => {
        map.addSource('Coordinates', {
            type: 'geojson',
            data: 'data/mora_county_roads.geojson'
        });

        map.addLayer({
            id: 'Coordinates',
            type: 'line',
            source: 'Coordinates',
            paint: {
                'line-radius': 3,
                'line-color': '#007cbf'
            }
        });
});
    </script>
      /* CUSTOMIZATIONS
   1. changed colors 
   2. Changed basemap style 
   3. added two layers 
*/
</body>
</html>
